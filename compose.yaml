# my-claude-env : Claude Code en Remote Control (claude) et démon Docker isolé (dind).
# claude partage l'espace réseau de dind : le démon, les serveurs de dev natifs et les
# ports publiés par les conteneurs internes sont tous sur localhost.
name: my-claude-env

services:
  dind:
    # Rootless : privileged sert à rootlesskit, mais le démon tourne sous l'utilisateur
    # rootless. Un conteneur --privileged lancé depuis claude n'atteint pas l'hôte.
    image: docker:dind-rootless
    privileged: true
    hostname: claude-env
    restart: unless-stopped
    environment:
      DOCKER_TLS_CERTDIR: ""
      # Le démon vit dans l'espace réseau de rootlesskit ; seul ce port le relie à celui
      # partagé avec claude, et sur la boucle locale seulement.
      DOCKERD_ROOTLESS_ROOTLESSKIT_FLAGS: "-p 127.0.0.1:2375:2375/tcp"
    # Sans TLS, sur la boucle locale. "dockerd" en tête : sinon l'entrypoint publie 0.0.0.0:2375.
    command: ["dockerd", "--host=unix:///run/user/1000/docker.sock", "--host=tcp://127.0.0.1:2375", "--tls=false"]
    volumes:
      # Volume neuf : dind-data, écrit par l'ancien démon root, reste intact mais inutilisé.
      - dind-rootless-data:/home/rootless/.local/share/docker
    ports:
      - "127.0.0.1:${PORT_RANGE:-4100-4119}:${PORT_RANGE:-4100-4119}"
    mem_limit: ${DIND_MEM:-2g}
    healthcheck:
      test: ["CMD", "docker", "-H", "tcp://127.0.0.1:2375", "info"]
      interval: 10s
      timeout: 5s
      retries: 12

  claude:
    build: .
    image: my-claude-env:latest
    network_mode: service:dind
    init: true
    restart: unless-stopped
    depends_on:
      dind:
        condition: service_healthy
        restart: true
    env_file:
      - path: .env
        required: false
    environment:
      DOCKER_HOST: tcp://127.0.0.1:2375
    volumes:
      - home:/home/dev
      - workspace:/workspace
    mem_limit: ${CLAUDE_MEM:-3g}
    cpus: ${CLAUDE_CPUS:-3}

volumes:
  home:
  workspace:
  dind-rootless-data:
